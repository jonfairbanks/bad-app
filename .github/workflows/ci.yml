name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "31 15 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Develop for Main PRs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == "pull_request" && "$BASE" == "main" ]]; then
            [[ "$HEAD" == "develop" && "$HEAD_REPO" == "$REPO" ]]
          fi

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: pip install pipenv==2026.2.2
      - run: pipenv verify && pipenv sync --dev
      - run: pipenv run python -m unittest discover -s tests -v

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: pip install pipenv==2026.2.2
      - run: pipenv verify && pipenv sync --dev
      - run: pipenv run pip-audit --strict

  image:
    name: Container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check Dockerfile
        run: docker buildx build --check .
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: bad-app:ci
          cache-from: type=gha,scope=bad-app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bad-app-${{ matrix.arch }}
      - name: Exercise Production Container
        run: python3 scripts/smoke_container.py bad-app:ci
      - name: Report All High and Critical Findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bad-app:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Block Fixable High and Critical Findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bad-app:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install Kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Require Chart Version Increment
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if ! git cat-file -e "origin/$BASE_REF:charts/bad-app/Chart.yaml" 2>/dev/null; then exit 0; fi
          if git diff --quiet "origin/$BASE_REF" HEAD -- charts/bad-app; then exit 0; fi
          base_version=$(git show "origin/$BASE_REF:charts/bad-app/Chart.yaml" | awk '/^version:/ { print $2; exit }')
          current_version=$(awk '/^version:/ { print $2; exit }' charts/bad-app/Chart.yaml)
          dpkg --compare-versions "$current_version" gt "$base_version"
      - name: Lint and Validate Chart
        run: |
          helm lint --strict charts/bad-app
          helm package charts/bad-app --destination /tmp/charts
          helm template bad-app charts/bad-app > /tmp/default.yaml
          helm template overrides charts/bad-app \
            --set ingress.enabled=true --set ingress.className=traefik \
            --set 'ingress.hosts[0].host=bad-app.example.internal' \
            --set 'ingress.hosts[0].paths[0].path=/' --set 'ingress.hosts[0].paths[0].pathType=Prefix' \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set serviceAccount.create=true --set 'imagePullSecrets[0].name=registry-pull' \
            > /tmp/overrides.yaml
          kubeconform -strict -summary -kubernetes-version 1.36.2 /tmp/default.yaml /tmp/overrides.yaml

  release:
    name: Publish Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source, tests, audit, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bump Release Tag
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 1.0.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            jonfairbanks/bad-app:${{ steps.version.outputs.new_tag }}
            jonfairbanks/bad-app:sha-${{ github.sha }}
            jonfairbanks/bad-app:latest
          cache-from: type=gha,scope=bad-app-amd64
          provenance: mode=min
          sbom: true
      - name: Verify Published Image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image="jonfairbanks/bad-app@${IMAGE_DIGEST}"
          docker pull "$image"
          python3 scripts/smoke_container.py "$image"
      - name: Notify Slack
        if: always()
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}

  publish-chart:
    name: Publish Helm Chart
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Chart Changes
        id: chart
        run: |
          if git diff --quiet HEAD^ HEAD -- charts/bad-app; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.chart.outputs.changed == 'true'
        with:
          version: v4.3.0
      - name: Publish Immutable Chart Version
        if: steps.chart.outputs.changed == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '/^version:/ { print $2; exit }' charts/bad-app/Chart.yaml)
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if helm show chart oci://ghcr.io/jonfairbanks/charts/bad-app --version "$version" >/dev/null 2>&1; then
            echo "Chart $version already exists; increment Chart.yaml." >&2
            exit 1
          fi
          helm package charts/bad-app --destination /tmp/charts
          helm push "/tmp/charts/bad-app-${version}.tgz" oci://ghcr.io/jonfairbanks/charts
          mkdir -p /tmp/verified
          helm pull oci://ghcr.io/jonfairbanks/charts/bad-app --version "$version" --destination /tmp/verified
