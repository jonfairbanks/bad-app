replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: jonfairbanks/bad-app
  # Pin the released sha-<commit> tag or digest in GitOps before deployment.
  tag: latest
  digest: ""
  pullPolicy: Always
imagePullSecrets: []

serviceAccount:
  create: false
  name: ""
  annotations: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

containerPort: 5000
workers: 2
terminationGracePeriodSeconds: 30
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bad-app.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 12
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
